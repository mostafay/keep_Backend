<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
      <base href="/keep">
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="keep">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>keep</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #loading-screen.hidden {
      display: none;
    }

    #loading-screen h1 {
      color: white;
      margin-bottom: 30px;
      font-size: 24px;
    }

    #loading-screen .input-container {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #loading-screen input {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      width: 300px;
      outline: none;
    }

    #loading-screen button {
      padding: 12px 24px;
      background: white;
      color: #667eea;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s;
    }

    #loading-screen button:hover {
      transform: scale(1.05);
    }

    #loading-screen .spinner {
      margin-top: 20px;
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <h1>مرحباً بك</h1>
    <div class="input-container">
      <input type="text" id="user-input" placeholder="أدخل النص هنا..." />
      <button onclick="handleButtonClick()">إرسال</button>
    </div>
    <div class="spinner"></div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    const SERVER_URL = 'https://keep-backend-rlxt.onrender.com';

    async function handleButtonClick() {
      const input = document.getElementById('user-input');
      const value = input.value.trim();

      if (!value) {
        alert('الرجاء إدخال رابط');
        return;
      }

      // إضافة https:// إذا لم يكن موجوداً
      const url = value.startsWith('http://') || value.startsWith('https://')
        ? value
        : `https://${value}`;

      const button = document.querySelector('#loading-screen button');
      button.disabled = true;
      button.textContent = 'جاري الحفظ...';

      try {
        const response = await fetch(`${SERVER_URL}/save-url-only`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ sit: url, group: '' }),
        });

        const data = await response.json();

        if (response.ok && data.success) {
          const title = document.querySelector('#loading-screen h1');
          title.textContent = ' ✓ تم الحفظ';
          input.value = '';
        } else if (response.status === 409) {
          alert('الرابط موجود بالفعل في الجدول');
        } else {
          alert('فشل حفظ الرابط: ' + (data.error || 'حدث خطأ غير معروف'));
        }
      } catch (error) {
        console.error('Error:', error);
        alert('فشل الاتصال بالسيرفر');
      } finally {
        button.disabled = false;
        button.textContent = 'إرسال';
      }
    }

    // إخفاء شاشة التحميل بعد تحميل Flutter
    window.addEventListener('flutter-first-frame', () => {
      const loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen) {
        loadingScreen.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
